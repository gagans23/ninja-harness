name: Scheduled Agent Eval

# Runs the agent behavior & safety scenario suite on a schedule and posts a
# compact PASS/WARN/FAIL summary. This is the "/eval" loop's CI half: it
# produces a phone-friendly report and (optionally) POSTs it to a webhook you
# control — wire that webhook to WhatsApp / Slack / Telegram on your side.
#
# To enable notifications, add any of these repo secrets:
#   NINJA_SLACK_WEBHOOK                         (Slack Incoming Webhook URL)
#   NINJA_TELEGRAM_BOT_TOKEN + NINJA_TELEGRAM_CHAT_ID   (Telegram bot)
#   NINJA_NOTIFY_WEBHOOK                        (generic {"text": ...} endpoint)
# If none are set, the notify step just prints the summary (no fake calls).

on:
  schedule:
    - cron: "0 13 * * *"   # daily at 13:00 UTC
  workflow_dispatch: {}     # allow manual runs

jobs:
  eval:
    runs-on: ubuntu-latest
    env:
      NINJA_SLACK_WEBHOOK: ${{ secrets.NINJA_SLACK_WEBHOOK }}
      NINJA_TELEGRAM_BOT_TOKEN: ${{ secrets.NINJA_TELEGRAM_BOT_TOKEN }}
      NINJA_TELEGRAM_CHAT_ID: ${{ secrets.NINJA_TELEGRAM_CHAT_ID }}
      NINJA_NOTIFY_WEBHOOK: ${{ secrets.NINJA_NOTIFY_WEBHOOK }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .

      - name: Run scenario suite
        id: eval
        run: |
          set -o pipefail
          # Capture the compact summary; don't let a non-zero suite exit abort the job.
          ninja-harness suite \
            --suite examples/scenarios/suite.yaml \
            --format summary | tee summary.txt || true
          {
            echo '```'
            cat summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify (Slack / Telegram / webhook — optional)
        run: python scripts/notify.py summary.txt
