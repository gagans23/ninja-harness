<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ninja Harness — Browser Playground</title>
<meta name="description" content="Evaluate AI agent traces in your browser. Trace-first evals + PASS/WARN/FAIL certification, running fully client-side via Pyodide." />
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; background: #0f172a; color: #e2e8f0; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: #94a3b8; font-size: 14px; margin-bottom: 16px; }
  a { color: #818cf8; }
  .status { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px;
    background: #1e293b; border: 1px solid #334155; font-size: 13px; margin-bottom: 12px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #f59e0b; }
  .dot.ready { background: #22c55e; }
  .dot.err { background: #ef4444; }
  .form-card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 16px; margin: 12px 0; }
  label { display: block; color: #94a3b8; font-size: 13px; margin: 10px 0 4px; }
  textarea { width: 100%; min-height: 170px; background: #0b1120; color: #e2e8f0; border: 1px solid #334155;
    border-radius: 8px; padding: 10px; font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
  button { background: #6366f1; color: #fff; border: 0; padding: 10px 18px; border-radius: 8px; font-weight: 700;
    font-size: 14px; cursor: pointer; margin-top: 12px; }
  button:disabled { background: #475569; cursor: not-allowed; }
  button:not(:disabled):hover { background: #4f46e5; }
  .results { margin-top: 8px; }
  .foot { color: #64748b; font-size: 12px; margin-top: 24px; text-align: center; }
  .err-box { background: #1e293b; border: 1px solid #7f1d1d; color: #fca5a5; border-radius: 10px; padding: 14px; margin: 12px 0; white-space: pre-wrap; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🥷 Ninja Harness — Browser Playground</h1>
  <div class="sub">
    Evaluate an agent trace fully in your browser — no install, no server, no data leaves the page.
    Powered by <a href="https://pyodide.org/" target="_blank" rel="noopener">Pyodide</a>.
    &nbsp;·&nbsp; <a href="https://github.com/gagans23/ninja-harness" target="_blank" rel="noopener">GitHub</a>
  </div>

  <div class="status"><span class="dot" id="dot"></span><span id="status">Booting Python runtime…</span></div>

  <form class="form-card" id="form">
    <label for="trace">Trace JSON (Custom JSON, OpenAI Agents, LangGraph, Hermes, CrewAI, AutoGen, or OpenTelemetry)</label>
    <textarea id="trace"></textarea>
    <label for="case">Eval case (optional — YAML or JSON)</label>
    <textarea id="case" style="min-height: 90px"></textarea>
    <button type="submit" id="run" disabled>Evaluate &rarr;</button>
  </form>

  <div class="results" id="results"></div>
  <div class="foot">Runs client-side via Pyodide · github.com/gagans23/ninja-harness</div>
</div>

<script src="https://cdn.jsdelivr.net/pyodide/v0.27.2/full/pyodide.js"></script>
<script>
const WHEEL_VERSION = "0.6.0";
const WHEEL_URL = `vendor/ninja_harness-${WHEEL_VERSION}-py3-none-any.whl`;

const EXAMPLE_TRACE = {
  agent_name: "ResearchAgent",
  task: "Summarize recent advances in transformer efficiency.",
  final_output: "Key advances include FlashAttention for memory-efficient attention, mixture-of-experts routing, and speculative decoding for faster inference.",
  steps: [
    { agent_name: "ResearchAgent", step_type: "plan", output: "Search for recent efficiency techniques." },
    { agent_name: "ResearchAgent", step_type: "action", output: "Calling web_search." },
    { agent_name: "ResearchAgent", step_type: "observation", output: "Found FlashAttention, MoE, speculative decoding." }
  ],
  tool_calls: [
    { tool_name: "web_search", arguments: { query: "transformer efficiency 2024" }, result: "FlashAttention, MoE, speculative decoding.", status: "success" }
  ]
};

const EXAMPLE_CASE = `case_id: transformer-efficiency
task: Summarize recent advances in transformer efficiency.
expected_output: FlashAttention, mixture-of-experts, and speculative decoding improve transformer efficiency.
references:
  - FlashAttention reduces attention memory cost.
  - Mixture-of-Experts routing reduces per-token compute.`;

const statusEl = document.getElementById("status");
const dotEl = document.getElementById("dot");
const runBtn = document.getElementById("run");
const resultsEl = document.getElementById("results");

document.getElementById("trace").value = JSON.stringify(EXAMPLE_TRACE, null, 2);
document.getElementById("case").value = EXAMPLE_CASE;

function setStatus(text, state) {
  statusEl.textContent = text;
  dotEl.className = "dot" + (state ? " " + state : "");
}

const PY_SETUP = `
import json
from ninja_harness.adapters import detect_adapter
from ninja_harness.scoring.ninja_score import NinjaScoreAggregator
from ninja_harness.reporters.html import render_fragment, VIEWER_CSS
from ninja_harness.schemas import EvaluationCase

_aggregator = NinjaScoreAggregator()

def nh_evaluate(trace_str, case_str):
    try:
        raw = json.loads(trace_str)
    except Exception as exc:
        return '<div class="card err">Invalid trace JSON: ' + str(exc) + '</div>'
    try:
        run = detect_adapter(raw).parse(raw)
    except Exception as exc:
        return '<div class="card err">Could not parse trace: ' + str(exc) + '</div>'
    case = None
    cs = (case_str or "").strip()
    if cs:
        try:
            data = json.loads(cs)
        except Exception:
            try:
                import yaml
                data = yaml.safe_load(cs)
            except Exception as exc:
                return '<div class="card err">Invalid eval case: ' + str(exc) + '</div>'
        try:
            case = EvaluationCase.model_validate(data)
        except Exception as exc:
            return '<div class="card err">Invalid eval case: ' + str(exc) + '</div>'
    result = _aggregator.evaluate(run, case)
    return render_fragment(run, result)

VIEWER_CSS
`;

async function boot() {
  try {
    setStatus("Loading Python runtime…");
    const pyodide = await loadPyodide();

    setStatus("Installing dependencies…");
    await pyodide.loadPackage("micropip");
    const micropip = pyodide.pyimport("micropip");
    await micropip.install(["pydantic", "pyyaml"]);

    setStatus("Installing Ninja Harness…");
    try {
      await micropip.install(WHEEL_URL, false /* deps */);
    } catch (e) {
      // Fallback to PyPI once published.
      await micropip.install("ninja-harness", false);
    }

    setStatus("Finishing setup…");
    const css = pyodide.runPython(PY_SETUP);
    const style = document.createElement("style");
    style.textContent = css;
    document.head.appendChild(style);

    window._pyodide = pyodide;
    setStatus("Ready — evaluate a trace", "ready");
    runBtn.disabled = false;
  } catch (err) {
    setStatus("Failed to load runtime", "err");
    resultsEl.innerHTML =
      '<div class="err-box">Could not initialize the in-browser runtime.\n' +
      'This page must be served over http(s) (e.g. GitHub Pages), not opened from a file://. \n\n' +
      String(err) + '</div>';
  }
}

document.getElementById("form").addEventListener("submit", (e) => {
  e.preventDefault();
  if (!window._pyodide) return;
  const trace = document.getElementById("trace").value;
  const caseStr = document.getElementById("case").value;
  try {
    const fn = window._pyodide.globals.get("nh_evaluate");
    const html = fn(trace, caseStr);
    resultsEl.innerHTML = html;
    fn.destroy();
  } catch (err) {
    resultsEl.innerHTML = '<div class="err-box">' + String(err) + '</div>';
  }
});

boot();
</script>
</body>
</html>
